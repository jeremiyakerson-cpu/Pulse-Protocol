    <div class="row" style="margin-bottom:12px;">
      <div class="eyebrow"><span class="dot"></span> ER Study Monitor</div>
      <div class="eyebrow"><span class="dot"></span> Live</div>
    </div>
    <div class="row" style="align-items:flex-end;">
      <div>
        <div class="score-big mono"><span id="scoreVal">0</span><span class="score-sub" id="totalVal">/0</span></div>
        <div class="label" id="scoreLabel">Score</div>
      </div>
      <div style="text-align:right;">
        <div class="streak-big mono" id="streakVal">0</div>
        <div class="label" id="streakLabel">Streak</div>
      </div>
    </div>
    <div class="bar-bg"><div class="bar-fg" id="progressBar" style="width:0%;"></div></div>
  </div>

  <div id="quizArea" class="card"></div>
