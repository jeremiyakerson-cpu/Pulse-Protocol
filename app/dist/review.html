<script>window.PP_DATA={"version":"13.1-draft","cases":[{"id":"ankle-inversion","section":"Musculoskeletal and wound","kind":"urgent","title":"Rolled ankle on the court","patient":"22-year-old man","vignette":"He rolled his right ankle inward during a pickup basketball game an hour ago. He walked in with a limp. The lateral ankle is swollen and tender just in front of the lateral malleolus. There is no tenderness along the back edge or tip of either malleolus, the base of the fifth metatarsal or the navicular. He took four steps in triage without help.","vitals":{"HR":84,"BP":"128/76","RR":16,"SpO2":99,"Temp":36.8,"Pain":"6/10"},"stages":[{"label":"Imaging","prompt":"Using the Ottawa ankle rules, does he need an ankle X-ray?","options":[{"t":"Yes. Any ankle with visible swelling needs a film.","ok":false,"why":"Swelling is not one of the criteria. The rules look only at bone tenderness at specific sites and the ability to bear weight."},{"t":"No. He has no tenderness at the defined bony sites and could take four steps.","ok":true,"why":"Correct. With no point tenderness at the posterior edge or tip of either malleolus and the ability to bear weight for four steps, the rules say an X-ray is not needed."},{"t":"Yes, because an inversion mechanism is high risk.","ok":false,"why":"Mechanism is not part of the rules. Inversion is the most common mechanism for simple sprains."},{"t":"Only if his pain score is 7 or higher.","ok":false,"why":"Pain intensity is not a criterion. A high pain score with no bony tenderness still does not meet the rules."}],"takeaway":"Ottawa ankle rules: X-ray if there is malleolar-zone pain plus bone tenderness at the posterior edge or tip of either malleolus, or inability to bear weight four steps both at injury and in the ED."},{"label":"First care","prompt":"What is the best initial nursing care?","options":[{"t":"Ice, elevation and compression, then document distal pulses, sensation and capillary refill.","ok":true,"why":"Correct. Cold and elevation limit swelling, and a neurovascular check gives a baseline before any wrap or splint."},{"t":"Apply heat to loosen the joint.","ok":false,"why":"Heat in the first 48 hours increases blood flow and swelling."},{"t":"Apply a circumferential cast.","ok":false,"why":"A rigid circumferential cast on a fresh, swelling injury risks compartment pressure, and a sprain does not need one."},{"t":"Tell him not to bear weight at all for six weeks.","ok":false,"why":"Early protected weight bearing as tolerated speeds recovery from lateral sprains. Prolonged immobilization does not."}],"takeaway":"Recheck the neurovascular status after any wrap or splint is applied."}],"related":["ottawa-ankle","neurovascular-check"],"flags":[]},{"id":"febrile-toddler","section":"Pediatrics","kind":"urgent","title":"Febrile toddler with ear pain","patient":"3-year-old girl, 15 kg","vignette":"Her father says she has had a fever since last night and keeps pulling at her right ear. She is playful in the waiting room, drinking juice and has had two wet diapers today. Immunizations are up to date. No medication has been given yet.","vitals":{"HR":132,"BP":"98/60","RR":26,"SpO2":99,"Temp":39.2,"Weight":"15 kg"},"stages":[{"label":"Antipyretic","prompt":"The provider orders acetaminophen PO by weight. Which dose is right for 15 kg?","dose_check":{"entry":"acetaminophen","weight":15},"options":[{"t":"150 mg","ok":false,"why":"That is 10 mg/kg, below the reference dose of 15 mg/kg."},{"t":"225 mg","ok":true,"why":"Correct. 15 mg/kg × 15 kg = 225 mg, under the 1000 mg single-dose cap. At 160 mg/5 mL that is about 7 mL."},{"t":"450 mg","ok":false,"why":"That is 30 mg/kg, double the reference dose. Repeated doubling is a common cause of pediatric liver injury."},{"t":"Aspirin 81 mg","ok":false,"why":"Aspirin is avoided in children with viral-type illness because of the risk of Reye syndrome."}],"takeaway":"Calculate from the reference table, then check the concentration on the bottle before converting to mL."},{"label":"Teaching","prompt":"Which discharge teaching point is most important?","options":[{"t":"Measure with the oral syringe that comes with the medicine and dose by weight, not age.","ok":true,"why":"Correct. Kitchen spoons and age-based dosing are the most common sources of home dosing errors."},{"t":"Wake her every two hours overnight to give fever medicine.","ok":false,"why":"Treating the number is not the goal. Antipyretics are for comfort, and sleep is fine if she is comfortable."},{"t":"Alternate acetaminophen and ibuprofen every two hours.","ok":false,"why":"Alternating schedules increase the risk of dosing errors and are not routinely recommended."},{"t":"Return only if the fever goes above 40 °C.","ok":false,"why":"Return precautions are about how she looks and acts: hard breathing, fewer wet diapers, hard to wake, a rash that does not blanch. A single temperature cutoff is not enough."}],"takeaway":"Ask about every product given at home. Combination cold medicines often contain acetaminophen."}],"related":["pediatric-fever","weight-based-safety"],"flags":[]},{"id":"asthma-teen","section":"Respiratory","kind":"urgent","title":"Wheezing after soccer practice","patient":"16-year-old girl","vignette":"Known asthma. She ran out of her rescue inhaler last week. She is speaking in full sentences, sitting upright, with expiratory wheeze in all fields and mild intercostal retractions.","vitals":{"HR":108,"BP":"118/72","RR":24,"SpO2":95,"Temp":37.0},"stages":[{"label":"First treatment","prompt":"What is the first-line treatment to anticipate?","options":[{"t":"Inhaled short-acting beta-agonist (albuterol) by MDI with spacer or nebulizer, with early systemic steroid.","ok":true,"why":"Correct. A SABA relieves bronchospasm within minutes, and an early steroid reduces relapse and admission."},{"t":"IV magnesium as the first drug.","ok":false,"why":"Magnesium is an add-on for severe exacerbations that do not respond to initial bronchodilators."},{"t":"Oral antibiotic.","ok":false,"why":"Most exacerbations are viral or trigger-driven. Antibiotics do not treat bronchospasm."},{"t":"Sedative to reduce anxiety.","ok":false,"why":"Sedatives suppress respiratory drive and are avoided in an acute asthma attack."}],"takeaway":"Reassess work of breathing, speech and SpO2 after each treatment."},{"label":"Reassessment","update":"Forty minutes later she is quiet and can only say two or three words at a time. The wheeze is much softer. SpO2 89%, RR 34, HR 136.","prompt":"How do you read the softer wheeze?","options":[{"t":"Improving. Less wheezing means the airways are opening.","ok":false,"why":"Less wheeze with worse speech, rising RR and falling SpO2 means less air is moving."},{"t":"Ominous. A quiet chest with fatigue suggests too little airflow. Escalate now.","ok":true,"why":"Correct. A silent or near-silent chest is a sign of impending respiratory failure. Call the provider and prepare for continuous bronchodilators, adjuncts and possible airway support."},{"t":"Anxiety. Coach slow breathing and recheck in an hour.","ok":false,"why":"Waiting an hour risks arrest. Objective signs are worsening."},{"t":"Normal post-treatment fatigue. Let her rest.","ok":false,"why":"Fatigue in a child working this hard to breathe is a red flag, not recovery."}],"takeaway":"Watch the trend in speech and mental status as much as the wheeze."}],"related":["asthma-exacerbation"],"flags":[]},{"id":"shrimp-anaphylaxis","section":"Medical emergencies","kind":"urgent","title":"Hives and a hoarse voice after dinner","patient":"29-year-old woman","vignette":"She ate shrimp at a restaurant 20 minutes ago. She has hives on her chest and arms, swollen lips, a hoarse voice and audible wheeze. She says her throat feels tight.","vitals":{"HR":118,"BP":"92/58","RR":24,"SpO2":93,"Temp":36.9},"stages":[{"label":"First drug","prompt":"Which medication comes first?","options":[{"t":"Epinephrine IM in the anterolateral thigh.","ok":true,"why":"Correct. Epinephrine is the only first-line drug. It reverses airway edema, bronchospasm and vasodilation."},{"t":"Diphenhydramine IV.","ok":false,"why":"Antihistamines help the itching and hives but do not treat airway swelling or hypotension. They are adjuncts after epinephrine."},{"t":"Methylprednisolone IV.","ok":false,"why":"Steroids take hours to work and do not treat the acute reaction. Evidence that they prevent biphasic reactions is weak."},{"t":"Nebulized albuterol alone.","ok":false,"why":"Albuterol treats bronchospasm only. It does nothing for laryngeal edema or shock."}],"takeaway":"Delayed epinephrine is the factor most often linked to fatal anaphylaxis."},{"label":"Persistent shock","update":"Five minutes after the first dose: BP 84/50, HR 126, still wheezing.","prompt":"What is the best next step?","options":[{"t":"Lay her flat with legs raised (or sitting if breathing is worse lying down), give an isotonic fluid bolus through a large-bore IV and anticipate a repeat IM epinephrine dose.","ok":true,"why":"Correct. Positioning and fluid support preload, and a repeat dose 5 to 15 minutes after the first is standard when symptoms persist."},{"t":"Help her stand and walk to the bathroom.","ok":false,"why":"Sudden upright posture during anaphylactic shock has been linked to cardiovascular collapse."},{"t":"Wait 30 minutes for the antihistamine to work.","ok":false,"why":"Antihistamines do not treat shock. Waiting delays the drug that does."},{"t":"Give a second dose of diphenhydramine.","ok":false,"why":"Repeating an adjunct does not address hypotension or airway swelling."}],"takeaway":"If she does not respond to two IM doses, anticipate an epinephrine infusion per protocol."},{"label":"Discharge","prompt":"She stabilizes. What is the key teaching before discharge?","options":[{"t":"Carry two epinephrine auto-injectors, practice using one, and know that symptoms can return hours later.","ok":true,"why":"Correct. Biphasic reactions occur in a minority of patients, and a second dose may be needed before EMS arrives."},{"t":"Oral antihistamines are enough if it happens again.","ok":false,"why":"Antihistamines do not stop progression to airway compromise or shock."},{"t":"A reaction this mild will not get worse next time.","ok":false,"why":"Severity is unpredictable from one exposure to the next."},{"t":"She can avoid shellfish by checking menus for the word 'shrimp'.","ok":false,"why":"Cross-contact and hidden ingredients are common. Avoidance teaching needs more than a single keyword."}],"takeaway":"Refer to an allergist and confirm she can show the auto-injector technique."}],"related":["anaphylaxis"],"flags":[]},{"id":"urosepsis-elder","section":"Medical emergencies","kind":"deterioration","title":"Confused and febrile from assisted living","patient":"78-year-old woman, 60 kg","vignette":"Staff say she has been more confused since yesterday and her urine smells strong. She is oriented to name only (her baseline is fully oriented). Skin is warm and flushed.","vitals":{"HR":112,"BP":"96/60","RR":24,"SpO2":94,"Temp":38.9,"Weight":"60 kg"},"stages":[{"label":"First hour","prompt":"Sepsis is suspected. Which sequence matches the first-hour bundle?","options":[{"t":"Lactate and blood cultures, broad-spectrum antibiotics, and 30 mL/kg crystalloid if hypotensive or lactate is 4 or higher.","ok":true,"why":"Correct. Cultures before antibiotics when that causes no meaningful delay, antibiotics within the hour, and fluids for hypoperfusion."},{"t":"Wait for the urinalysis before giving antibiotics.","ok":false,"why":"Each hour of delay in antibiotics for septic shock is associated with higher mortality. Do not wait for a source to be confirmed."},{"t":"Give antibiotics first and skip cultures to save time.","ok":false,"why":"Cultures should be drawn first when it does not delay antibiotics. They guide later de-escalation."},{"t":"Hold IV fluids because of her age.","ok":false,"why":"Age alone is not a reason to withhold fluids. Give the bolus and reassess for overload as you go."}],"takeaway":"Sepsis-3 qSOFA flags risk but is not recommended as a stand-alone screening tool. Use your facility's screen."},{"label":"Deterioration","update":"After 1.8 L of crystalloid: BP 82/44 (MAP 57), HR 124, lactate 4.6 mmol/L, lungs clear, more drowsy.","prompt":"What do you anticipate next?","options":[{"t":"Norepinephrine to target a MAP of 65 or higher, started peripherally if no central line yet.","ok":true,"why":"Correct. Norepinephrine is the first-line vasopressor, and current guidance suggests starting it peripherally rather than delaying for a central line."},{"t":"Another 30 mL/kg bolus without reassessing.","ok":false,"why":"Further fluid should be guided by dynamic reassessment. Persistent hypotension after the initial bolus calls for a vasopressor."},{"t":"Dopamine as the first vasopressor.","ok":false,"why":"Norepinephrine is preferred. Dopamine causes more arrhythmias."},{"t":"Wait for a central line before starting any vasopressor.","ok":false,"why":"Delaying vasopressors prolongs hypoperfusion. A large, proximal peripheral IV is acceptable short term."}],"takeaway":"Septic shock: vasopressor needed to keep MAP at 65 or above, and lactate above 2 despite adequate fluids."},{"label":"Monitoring","prompt":"Norepinephrine is running through a peripheral IV. What is the priority nursing check?","options":[{"t":"Inspect the IV site often for blanching, swelling or coolness, and know where the extravasation protocol and antidote are.","ok":true,"why":"Correct. Extravasation can cause tissue necrosis. Early detection and treatment per protocol limits injury."},{"t":"Check the site once per shift.","ok":false,"why":"Peripheral vasopressors need frequent site checks per policy, often hourly or more."},{"t":"Titrate to a systolic of 140 for a safety margin.","ok":false,"why":"Overshooting the MAP target increases vasoconstriction and arrhythmia risk without benefit."},{"t":"Stop monitoring urine output since she is on a vasopressor.","ok":false,"why":"Urine output (about 0.5 mL/kg/h or more) is a key marker of perfusion. Keep tracking it."}],"takeaway":"Trend lactate, mental status, urine output and capillary refill alongside MAP."}],"related":["sepsis","vasopressor-safety","sepsis-screening-card"],"flags":["Surviving Sepsis Campaign 2021 recommends against qSOFA alone as a screening tool, compared with SIRS, NEWS or MEWS. Older material may still teach qSOFA as the screen."]},{"id":"inferior-stemi-rv","section":"Cardiovascular","kind":"deterioration","title":"Chest pressure and a slow pulse","patient":"61-year-old man","vignette":"Crushing chest pressure for 40 minutes, sweating and nauseated. History of hypertension and smoking.","vitals":{"HR":54,"BP":"98/62","RR":20,"SpO2":95,"Temp":36.7},"stages":[{"label":"Door to ECG","prompt":"What is the goal time for the first 12-lead ECG?","options":[{"t":"Within 10 minutes of arrival.","ok":true,"why":"Correct. Early ECG starts the STEMI clock and the door-to-balloon target."},{"t":"Within 30 minutes, after labs are drawn.","ok":false,"why":"Labs should not delay the ECG. Troponin takes time; ST changes do not."},{"t":"After the provider examines him.","ok":false,"why":"Nurses can and should obtain the ECG on arrival for chest pain."},{"t":"Within an hour if pain persists.","ok":false,"why":"Every minute of delay loses heart muscle."}],"takeaway":"Door-to-balloon goal for primary PCI: 90 minutes or less."},{"label":"Nitrate order","update":"ECG: ST elevation in II, III and aVF. Right-sided leads show ST elevation in V4R. Provider orders nitroglycerin 0.4 mg SL.","prompt":"What do you do?","options":[{"t":"Hold the nitroglycerin and clarify the order, because of probable right ventricular infarction.","ok":true,"why":"Correct. An infarcted right ventricle depends on preload. Nitrates drop preload and can cause severe hypotension."},{"t":"Give the nitroglycerin as ordered. It relieves ischemic pain.","ok":false,"why":"Nitrates are relatively contraindicated in RV infarction and with SBP under 90 or marked bradycardia."},{"t":"Give morphine instead.","ok":false,"why":"Morphine also lowers preload and can mask ongoing ischemia. It is not a safe substitute here."},{"t":"Give furosemide to unload the heart.","ok":false,"why":"Diuresis worsens the preload problem in RV infarction."}],"takeaway":"Inferior STEMI: get right-sided leads before giving nitrates."},{"label":"Hypotension","update":"BP falls to 84/50. Lungs are clear. HR 50.","prompt":"What do you anticipate?","options":[{"t":"An IV fluid bolus to support preload, and ongoing preparation for the cath lab.","ok":true,"why":"Correct. With clear lungs, volume supports RV output while reperfusion is arranged."},{"t":"Fluid restriction to protect the lungs.","ok":false,"why":"Clear lungs and RV involvement favor careful volume loading, not restriction."},{"t":"A beta-blocker to slow the heart further.","ok":false,"why":"He is bradycardic and hypotensive. A beta-blocker could cause collapse."},{"t":"Cancel the cath lab until BP improves.","ok":false,"why":"Reperfusion is the definitive treatment and should not be delayed."}],"takeaway":"Watch for heart block with inferior MI, and have pacing available."}],"related":["acs-stemi","ecg-leads"],"flags":[]},{"id":"dka-young-adult","section":"Medical emergencies","kind":"deterioration","title":"Vomiting and deep breathing","patient":"19-year-old woman, type 1 diabetes","vignette":"Two days of vomiting and abdominal pain. She ran out of insulin. Breathing is deep and fast with a fruity odor. Labs: glucose 486 mg/dL, pH 7.12, bicarbonate 9 mEq/L, anion gap 26, potassium 3.1 mEq/L.","vitals":{"HR":124,"BP":"104/66","RR":30,"SpO2":99,"Temp":37.2},"stages":[{"label":"Before insulin","prompt":"Fluids are running. An insulin infusion is ordered. What do you do first?","options":[{"t":"Replace potassium and hold insulin until potassium is at least 3.3 mEq/L.","ok":true,"why":"Correct. Insulin drives potassium into cells. Starting it at 3.1 can cause dangerous hypokalemia and arrhythmia."},{"t":"Start the insulin infusion now. Glucose is the emergency.","ok":false,"why":"Glucose is not the immediate threat. Hypokalemia from insulin is."},{"t":"Give sodium bicarbonate for the low pH.","ok":false,"why":"Bicarbonate is reserved for severe acidosis (pH below about 7.0) and can worsen hypokalemia."},{"t":"Give a large insulin bolus to close the gap quickly.","ok":false,"why":"Rapid correction increases the risk of hypokalemia and, in younger patients, cerebral edema."}],"takeaway":"Check potassium before insulin and recheck it every 1 to 2 hours."},{"label":"Glucose falling","update":"Five hours later: glucose 238 mg/dL, anion gap 18, potassium 4.0.","prompt":"What change do you anticipate?","options":[{"t":"Add dextrose to the IV fluids and continue insulin until the gap closes.","ok":true,"why":"Correct. Insulin is what clears ketones. Dextrose lets it keep running without hypoglycemia."},{"t":"Stop insulin because glucose is near normal.","ok":false,"why":"Stopping insulin while the gap is open lets ketoacidosis return."},{"t":"Increase insulin to bring glucose to 100.","ok":false,"why":"The target is closing the gap, not normal glucose. Faster drops risk hypoglycemia."},{"t":"Switch to oral fluids and discharge.","ok":false,"why":"She is still acidotic. Resolution criteria are not met."}],"takeaway":"Treat the gap, not the glucose."},{"label":"Transition","prompt":"The gap has closed and she is eating. How is the drip stopped?","options":[{"t":"Give subcutaneous basal insulin 1 to 2 hours before stopping the infusion.","ok":true,"why":"Correct. The overlap prevents rebound ketosis, since IV insulin wears off within minutes."},{"t":"Stop the drip, then give subcutaneous insulin at the next meal.","ok":false,"why":"The gap in coverage can restart ketosis."},{"t":"Stop the drip and recheck glucose in the morning.","ok":false,"why":"No insulin coverage risks rapid recurrence."},{"t":"Keep the drip running until discharge.","ok":false,"why":"Once criteria are met and she is eating, she should transition to subcutaneous insulin."}],"takeaway":"Teach sick-day rules and how to get insulin when supply runs out."}],"related":["dka","potassium"],"flags":["DKA thresholds were revised in the 2024 ADA/EASD/JBDS/AACE/DTS consensus. Check that older materials do not conflict with it."]},{"id":"anticoag-head-injury","section":"Neurological","kind":"deterioration","title":"Fell off a ladder, on a blood thinner","patient":"45-year-old man","vignette":"He fell about two meters from a ladder and hit his head. He had a brief loss of consciousness. He now answers questions appropriately and moves all limbs. He takes apixaban for atrial fibrillation.","vitals":{"HR":78,"BP":"142/84","RR":16,"SpO2":98,"Temp":36.6},"stages":[{"label":"Risk","prompt":"He looks well. What is the priority?","options":[{"t":"Expedite a head CT. Anticoagulant use is a high-risk feature even when he looks well.","ok":true,"why":"Correct. Anticoagulated patients can bleed with few early signs, and delayed hemorrhage is a known risk."},{"t":"Discharge with a head-injury sheet if neuro checks stay normal for an hour.","ok":false,"why":"Anticoagulation changes the risk. A normal early exam does not rule out bleeding."},{"t":"Hold imaging until he develops symptoms.","ok":false,"why":"Waiting for symptoms means intervening after the bleed has expanded."},{"t":"Give acetaminophen and reassess in four hours.","ok":false,"why":"Pain control is fine, but it does not address the risk of intracranial hemorrhage."}],"takeaway":"Ask about anticoagulants and antiplatelets for every head injury."},{"label":"Change in status","update":"Forty minutes later, before CT: worsening headache, two episodes of vomiting, the right pupil is larger and sluggish, BP 178/90, HR 52, irregular breathing.","prompt":"What do you do?","options":[{"t":"Notify the provider now, raise the head of the bed to 30°, protect the airway and prepare for anticoagulant reversal and neurosurgery.","ok":true,"why":"Correct. Hypertension, bradycardia and irregular breathing (Cushing triad) plus a new pupil change suggest rising intracranial pressure and possible herniation."},{"t":"Give an antiemetic and recheck in an hour.","ok":false,"why":"Vomiting here is a sign of rising pressure. An hour's delay can be fatal."},{"t":"Give an antihypertensive to bring BP to normal.","ok":false,"why":"The hypertension may be maintaining cerebral perfusion. Blood pressure goals are set by the provider for this situation."},{"t":"Lay him flat to improve blood flow to the brain.","ok":false,"why":"Flat positioning reduces venous drainage and can raise intracranial pressure."}],"takeaway":"A pupil change plus Cushing triad is an emergency. Do not wait for imaging to escalate."}],"related":["head-injury","neuro-checks-card"],"flags":[]},{"id":"alkali-eye-splash","section":"Ocular and ENT","kind":"urgent","title":"Drain cleaner in the eye","patient":"41-year-old woman","vignette":"Five minutes ago she splashed liquid drain cleaner into her right eye while unclogging a sink. She is holding the eye shut, tearing heavily, and says it burns.","vitals":{"HR":96,"BP":"136/82","RR":18,"SpO2":99,"Temp":36.8,"Pain":"9/10"},"stages":[{"label":"First action","prompt":"What do you do first?","options":[{"t":"Start copious irrigation with normal saline or lactated Ringer's right away, after a topical anesthetic drop if one is at hand.","ok":true,"why":"Correct. Chemical eye injury is the exception to checking acuity first. Every minute of contact deepens the burn."},{"t":"Check visual acuity before anything else.","ok":false,"why":"Acuity is normally the vital sign of the eye, but chemical exposure is the exception. Irrigate first, then check."},{"t":"Neutralize the alkali with a dilute vinegar rinse.","ok":false,"why":"Neutralizing generates heat and adds a second chemical injury. Use large volumes of isotonic fluid."},{"t":"Patch the eye and call ophthalmology.","ok":false,"why":"Patching traps the chemical against the cornea. Irrigation cannot wait for the consult."}],"takeaway":"Alkalis penetrate deeper than acids (liquefactive necrosis), so alkali burns are often worse."},{"label":"Endpoint","prompt":"After the first liter, how do you decide when to stop irrigating?","options":[{"t":"Pause 5 to 10 minutes, check the pH in the lower fornix, and keep irrigating until it reads about 7.0 to 7.5.","ok":true,"why":"Correct. pH is the objective endpoint. Waiting a few minutes lets residual chemical show up before you stop."},{"t":"Stop after one liter, which is the standard volume.","ok":false,"why":"There is no fixed volume. Alkali exposures can need several liters to normalize pH."},{"t":"Stop when she says the pain is better.","ok":false,"why":"The anesthetic drop masks pain, so comfort does not mean the chemical is gone."},{"t":"Stop when the eye looks less red.","ok":false,"why":"Redness lags and can even look better as tissue blanches from ischemia. Use pH, not appearance."}],"takeaway":"Sweep the fornices for retained particles, then check acuity and arrange ophthalmology follow-up."}],"related":["chemical-eye"],"flags":[]},{"id":"kitchen-laceration","section":"Musculoskeletal and wound","kind":"urgent","title":"Knife slip while cooking","patient":"30-year-old man","vignette":"He cut his left palm with a clean kitchen knife 40 minutes ago. The 2 cm wound has stopped bleeding with pressure. His last tetanus shot was 12 years ago, and he completed the childhood series.","vitals":{"HR":82,"BP":"124/78","RR":14,"SpO2":99,"Temp":36.7,"Pain":"4/10"},"stages":[{"label":"Tetanus","prompt":"What does he need for tetanus prevention?","options":[{"t":"A Tdap or Td booster, because it has been more than 10 years since his last dose.","ok":true,"why":"Correct. For a clean, minor wound in someone who completed the primary series, a booster is due if the last dose was 10 or more years ago."},{"t":"Nothing. The wound is clean and minor.","ok":false,"why":"Clean, minor wounds still need a booster once 10 years have passed."},{"t":"A booster plus tetanus immune globulin.","ok":false,"why":"Immune globulin is for people with fewer than three prior doses or an unknown history, and mainly for dirty wounds. He completed the series."},{"t":"Only if the wound becomes infected.","ok":false,"why":"Tetanus prevention is given at the time of injury, not after signs of infection."}],"takeaway":"For dirty or major wounds the booster threshold is 5 years, not 10."},{"label":"Before closure","prompt":"Before the provider numbs the wound, what should you assess?","options":[{"t":"Sensation on each side of the fingers and active flexion and extension of each finger, against resistance.","ok":true,"why":"Correct. Local anesthetic hides nerve injury, and palm wounds can cut flexor tendons. Test first and document."},{"t":"Capillary refill only.","ok":false,"why":"Perfusion matters, but it says nothing about nerve or tendon damage."},{"t":"Nothing until after anesthesia, so the exam is painless.","ok":false,"why":"After anesthesia you cannot test sensation, so a nerve injury can be missed."},{"t":"Soak the hand in povidone-iodine for 10 minutes.","ok":false,"why":"Soaking is not an assessment, and full-strength antiseptics damage tissue. High-pressure irrigation with saline or tap water is preferred."}],"takeaway":"Explore palm and finger wounds through full range of motion. Tendons can be cut in a different position than they sit at rest."}],"related":["laceration-care","neurovascular-check"],"flags":[]},{"id":"peds-hypoglycemia","section":"Pediatrics","kind":"urgent","title":"Shaky and confused at school","patient":"6-year-old boy, 20 kg, type 1 diabetes","vignette":"The school nurse sent him in after lunch. He skipped most of his meal after his usual insulin. He is sweaty, pale and confused, and cannot follow commands well enough to swallow safely. Point-of-care glucose is 42 mg/dL. An IV is in place.","vitals":{"HR":128,"BP":"102/64","RR":22,"SpO2":99,"Temp":36.6,"Weight":"20 kg"},"stages":[{"label":"Dextrose","prompt":"The order is dextrose 10% IV by weight. Using the reference table, what dose is right for 20 kg?","dose_check":{"entry":"dextrose-d10","weight":20},"options":[{"t":"2 g (20 mL of D10)","ok":false,"why":"That is 0.1 g/kg, a fifth of the reference dose of 0.5 g/kg."},{"t":"10 g (100 mL of D10)","ok":true,"why":"Correct. 0.5 g/kg × 20 kg = 10 g. D10 is 0.1 g/mL, so 10 g is 100 mL (5 mL/kg)."},{"t":"25 g of D50 by IV push","ok":false,"why":"D50 is hypertonic and damages small peripheral veins. D10 is preferred in children."},{"t":"120 mL of juice by mouth","ok":false,"why":"He cannot protect his airway. Oral sugar is only for people who can swallow safely."}],"takeaway":"Convert grams to mL using the concentration: D10 is 0.1 g/mL."},{"label":"After treatment","prompt":"He wakes up and is talking normally. What comes next?","options":[{"t":"Recheck glucose in 15 minutes, give a snack with complex carbohydrate and protein once he can eat, and look for the cause.","ok":true,"why":"Correct. The dextrose effect is short. Food and a recheck prevent a repeat low."},{"t":"Discharge him now, since he is back to normal.","ok":false,"why":"Without a recheck and food, his glucose can drop again within the hour."},{"t":"Give his next insulin dose now to stay on schedule.","ok":false,"why":"More insulin without food risks another severe low. Dosing is reviewed with the provider."},{"t":"No further checks are needed after one dose of dextrose.","ok":false,"why":"Rebound hypoglycemia is common. Serial checks are standard."}],"takeaway":"Teach the family and school to treat early and to carry fast-acting sugar."}],"related":["hypoglycemia","weight-based-safety"],"flags":[]},{"id":"stable-svt","section":"Cardiovascular","kind":"urgent","title":"Racing heart at the gym","patient":"24-year-old woman, 70 kg","vignette":"Sudden pounding palpitations started 30 minutes ago during a workout. She is alert and talking, with no chest pain or shortness of breath. The monitor shows a regular narrow-complex tachycardia at 212 with no visible P waves.","vitals":{"HR":212,"BP":"118/76","RR":18,"SpO2":98,"Temp":36.8,"Weight":"70 kg"},"stages":[{"label":"First step","prompt":"She is stable. What is the first intervention?","options":[{"t":"Vagal maneuvers, such as a modified Valsalva with passive leg raise.","ok":true,"why":"Correct. In stable SVT, vagal maneuvers are first-line and convert a meaningful share of patients without drugs."},{"t":"Synchronized cardioversion.","ok":false,"why":"Cardioversion is for unstable patients (hypotension, altered mentation, shock, chest pain, acute heart failure)."},{"t":"IV amiodarone.","ok":false,"why":"Amiodarone is not first-line for stable narrow-complex SVT."},{"t":"Wait to see if it stops on its own.","ok":false,"why":"Waiting is not appropriate at a rate of 212. Start with a quick, low-risk maneuver."}],"takeaway":"Record a rhythm strip during any maneuver or drug, so the conversion is documented."},{"label":"Adenosine","prompt":"Vagal maneuvers fail. Adenosine is ordered by the reference table. How is the first dose given?","dose_check":{"entry":"adenosine","weight":70},"options":[{"t":"6 mg rapid IV push, immediately followed by a rapid saline flush, through an IV close to the heart.","ok":true,"why":"Correct. 0.1 mg/kg × 70 kg is 7 mg, which is capped at the 6 mg first-dose maximum. Adenosine's half-life is seconds, so it must reach the heart fast."},{"t":"6 mg slow IV push over 2 minutes.","ok":false,"why":"Given slowly, adenosine is broken down before it reaches the heart."},{"t":"12 mg as the first dose.","ok":false,"why":"12 mg is the second dose, if the first does not work."},{"t":"7 mg, which is 0.1 mg/kg for her weight.","ok":false,"why":"The calculated dose exceeds the 6 mg first-dose cap. Doses never go above the listed maximum."}],"takeaway":"Warn her first: brief chest pressure, flushing and a sense of doom are common and pass within seconds."}],"related":["svt"],"flags":[]},{"id":"upper-gi-bleed","section":"Gastrointestinal","kind":"deterioration","title":"Black stools and lightheaded","patient":"64-year-old man","vignette":"Two days of black, tarry stools. He takes ibuprofen daily for knee pain. He felt faint standing up this morning.","vitals":{"HR":112,"BP":"98/60","RR":20,"SpO2":97,"Temp":36.6},"stages":[{"label":"Priorities","prompt":"What is the nursing priority on arrival?","options":[{"t":"Two large-bore IVs, type and crossmatch, CBC and coagulation labs, NPO and continuous monitoring.","ok":true,"why":"Correct. Tachycardia and soft blood pressure with melena mean significant blood loss. Access and blood availability come first."},{"t":"Wait for the hemoglobin result before placing IVs.","ok":false,"why":"Hemoglobin lags behind acute loss. Prepare for resuscitation based on the vital signs."},{"t":"Give a dose of oral iron.","ok":false,"why":"Iron does nothing for acute bleeding, and he should be NPO for possible endoscopy."},{"t":"Encourage him to walk to the bathroom to collect a stool sample.","ok":false,"why":"He is orthostatic. Walking risks a fall and syncope."}],"takeaway":"NSAIDs, anticoagulants and alcohol use are key history for GI bleeding."},{"label":"Hemorrhage","update":"He vomits about 400 mL of bright red blood. HR 132, BP 78/46, pale and confused.","prompt":"What do you anticipate now?","options":[{"t":"Blood product transfusion per the massive transfusion protocol, airway protection with suction ready, and emergent endoscopy.","ok":true,"why":"Correct. He is in hemorrhagic shock. Blood replaces what is lost, and confusion plus hematemesis put his airway at risk."},{"t":"Several liters of crystalloid until his BP normalizes.","ok":false,"why":"Large crystalloid volumes dilute clotting factors and worsen bleeding. Blood products are the priority."},{"t":"Recheck hemoglobin before transfusing.","ok":false,"why":"In active hemorrhage the hemoglobin has not caught up. Transfuse based on hemodynamics."},{"t":"Lay him flat on his back to raise his blood pressure.","ok":false,"why":"Flat and supine with active hematemesis risks aspiration. Position to protect the airway."}],"takeaway":"In stable GI bleeds a restrictive transfusion threshold (about 7 g/dL) is typical. Unstable patients are transfused on hemodynamics."},{"label":"Transfusion","update":"Fifteen minutes into the second unit he has chills, a temperature of 38.9 °C, low back pain and BP 70/40.","prompt":"What do you do?","options":[{"t":"Stop the transfusion, keep the IV open with normal saline through new tubing, notify the provider and blood bank, and send the bag and post-transfusion labs.","ok":true,"why":"Correct. Fever, back pain and hypotension early in a transfusion suggest an acute hemolytic reaction."},{"t":"Slow the transfusion and give acetaminophen.","ok":false,"why":"Slowing still infuses incompatible blood. Stop it."},{"t":"Finish the unit, since he needs the blood.","ok":false,"why":"Continuing a hemolytic reaction can cause kidney failure and DIC."},{"t":"Flush the existing tubing with saline and continue.","ok":false,"why":"The old tubing still contains the suspect product. Use new tubing."}],"takeaway":"Double-check patient identity and unit labels at the bedside. Most hemolytic reactions are identification errors."}],"related":["gi-bleed","massive-transfusion"],"flags":[]},{"id":"ruptured-ectopic","section":"Obstetric and gynecologic","kind":"deterioration","title":"Pelvic pain and a late period","patient":"26-year-old woman","vignette":"Right lower abdominal pain since last night and light vaginal spotting. Her last menstrual period was about seven weeks ago. She has a history of chlamydia.","vitals":{"HR":98,"BP":"112/70","RR":18,"SpO2":99,"Temp":36.9},"stages":[{"label":"First test","prompt":"Which test comes first?","options":[{"t":"A pregnancy test (urine or serum hCG).","ok":true,"why":"Correct. Every person of reproductive age with abdominal pain or bleeding needs a pregnancy test first. It changes the whole workup."},{"t":"CT of the abdomen and pelvis.","ok":false,"why":"Imaging choice depends on pregnancy status, and ultrasound is first-line in early pregnancy."},{"t":"Pain medication and discharge with follow-up.","ok":false,"why":"Ectopic pregnancy has not been ruled out. It is a leading cause of first-trimester death."},{"t":"Urinalysis for a urinary tract infection.","ok":false,"why":"A UA may be useful, but it does not exclude the dangerous diagnosis."}],"takeaway":"Prior pelvic infection, tubal surgery and prior ectopic pregnancy raise the risk."},{"label":"Rupture","update":"hCG is positive. While waiting for ultrasound, her pain suddenly worsens and she reports right shoulder pain. HR 128, BP 84/52. Bedside ultrasound shows free fluid.","prompt":"What do you anticipate?","options":[{"t":"Two large-bore IVs, type and crossmatch with Rh status, blood products ready, and immediate preparation for surgery.","ok":true,"why":"Correct. Shoulder pain (from blood irritating the diaphragm), shock and free fluid point to a ruptured ectopic pregnancy. She needs the OR."},{"t":"Methotrexate IV.","ok":false,"why":"Methotrexate is only for stable, unruptured ectopic pregnancies. She is in shock."},{"t":"Wait for the formal ultrasound report.","ok":false,"why":"The bedside findings and vital signs are enough to act. Delay increases blood loss."},{"t":"Oral fluids to treat dehydration.","ok":false,"why":"She needs IV access and blood, and she should be NPO for surgery."}],"takeaway":"If she is Rh negative, she needs Rh immune globulin."}],"related":["ectopic-pregnancy","massive-transfusion"],"flags":[]},{"id":"acute-stroke","section":"Neurological","kind":"deterioration","title":"Slurred speech at breakfast","patient":"68-year-old man","vignette":"His wife says he was normal at 7:10 this morning and slurred his words at 7:40. He has right arm weakness and a right facial droop. It is now 8:15.","vitals":{"HR":88,"BP":"196/104","RR":16,"SpO2":97,"Temp":36.7},"stages":[{"label":"First checks","prompt":"Besides activating the stroke team, what must be checked right away?","options":[{"t":"A point-of-care glucose, then a rapid non-contrast CT.","ok":true,"why":"Correct. Hypoglycemia can mimic stroke and is fixed in minutes. CT separates hemorrhage from ischemia before any thrombolytic."},{"t":"A lumbar puncture.","ok":false,"why":"LP is not part of the acute stroke workup and delays imaging."},{"t":"An EEG.","ok":false,"why":"EEG is not a first step. Imaging is."},{"t":"Wait for the full lab panel before imaging.","ok":false,"why":"Only glucose is needed before CT. Waiting for labs delays treatment."}],"takeaway":"Record last known well precisely. It sets every treatment window."},{"label":"Before thrombolysis","update":"CT shows no hemorrhage. The team plans thrombolysis. BP is still 196/104.","prompt":"What must happen before the thrombolytic is given?","options":[{"t":"Lower the BP to below 185/110 per protocol, and keep it below 180/105 afterward.","ok":true,"why":"Correct. Higher pressures raise the risk of bleeding into the brain after thrombolysis."},{"t":"Nothing. BP does not matter for thrombolysis.","ok":false,"why":"BP above 185/110 is a reason not to give a thrombolytic until it is controlled."},{"t":"Lower BP to 120/80 quickly.","ok":false,"why":"Dropping pressure too far can extend the stroke by lowering blood flow to the penumbra."},{"t":"Give a dose of aspirin first.","ok":false,"why":"Antiplatelets are held for 24 hours after thrombolysis."}],"takeaway":"Monitor BP and neuro checks frequently for 24 hours after thrombolysis per protocol."},{"label":"Change in status","update":"Forty minutes after thrombolysis he develops a severe headache, vomits, and his speech worsens.","prompt":"What do you do?","options":[{"t":"Stop any thrombolytic still infusing, notify the provider now and prepare for an emergent head CT.","ok":true,"why":"Correct. New headache, vomiting and neurological decline after a thrombolytic suggest intracranial hemorrhage."},{"t":"Give an antiemetic and recheck in an hour.","ok":false,"why":"Vomiting here is a red flag, not a side effect to treat and watch."},{"t":"Raise the BP target to improve perfusion.","ok":false,"why":"If he is bleeding, higher pressure makes it worse."},{"t":"Document it as expected post-stroke fatigue.","ok":false,"why":"Worsening speech is a neurological decline and needs action now."}],"takeaway":"Know where your facility's reversal agents for thrombolytics are kept."}],"related":["stroke","stroke-assessment-card"],"flags":["Tenecteplase gained FDA approval for acute ischemic stroke in 2025, and many centers now use a single bolus instead of an alteplase infusion. Check which drug your facility's protocol uses."]},{"id":"opioid-overdose","section":"Toxicology","kind":"deterioration","title":"Found down in a restroom","patient":"34-year-old man","vignette":"Staff found him unresponsive in a public restroom with a syringe nearby. He snores, his pupils are pinpoint and his lips are blue.","vitals":{"HR":58,"BP":"104/66","RR":6,"SpO2":82,"Temp":36.2},"stages":[{"label":"First action","prompt":"What comes first?","options":[{"t":"Open the airway and ventilate with a bag-valve mask and oxygen while naloxone is drawn up.","ok":true,"why":"Correct. The threat is hypoventilation. Ventilation fixes hypoxia right away, and naloxone follows."},{"t":"Give naloxone and wait to see if he starts breathing.","ok":false,"why":"Waiting with SpO2 at 82% and RR 6 prolongs hypoxia. Ventilate while giving naloxone."},{"t":"Sternal rub and observe.","ok":false,"why":"A painful stimulus does not treat respiratory depression."},{"t":"Place him in the recovery position and recheck in 15 minutes.","ok":false,"why":"Recovery position alone does not help someone who is barely breathing."}],"takeaway":"Titrate naloxone to adequate breathing, not full wakefulness, to avoid abrupt withdrawal."},{"label":"Re-sedation","update":"After naloxone he woke, breathed normally and wanted to leave. Fifty minutes later he is drowsy again with RR 7 and SpO2 86%.","prompt":"What best explains this, and what do you anticipate?","options":[{"t":"Naloxone wore off before the opioid did. Support breathing, re-dose naloxone and anticipate a naloxone infusion and longer observation.","ok":true,"why":"Correct. Naloxone lasts about 30 to 90 minutes, shorter than long-acting opioids and some potent synthetic analogs."},{"t":"An allergic reaction to naloxone.","ok":false,"why":"Allergy to naloxone is very rare and would not cause opioid-like re-sedation."},{"t":"Naloxone overdose.","ok":false,"why":"Naloxone does not cause sedation or respiratory depression."},{"t":"He must have taken a second, unrelated sedative, so naloxone will not help.","ok":false,"why":"Co-ingestion is possible, but recurrent opioid toxicity is the expected cause and still responds to naloxone."}],"takeaway":"Observe for re-sedation for several hours, longer after long-acting opioids. Offer naloxone and harm-reduction resources at discharge."}],"related":["opioid-toxicity"],"flags":["Xylazine is increasingly found mixed into the illicit opioid supply. Naloxone does not reverse it, so sedation can persist after breathing improves. Older materials do not mention it."]}],"index":[{"id":"sepsis","title":"Sepsis and septic shock","kind":"topic","category":"Medical emergencies","summary":"Life-threatening organ dysfunction from a dysregulated response to infection. Shock is sepsis that needs a vasopressor to keep MAP at 65 or above with lactate above 2 despite fluids.","assess":["New confusion or change from baseline","Fever or hypothermia","Tachycardia and tachypnea","Hypotension, mottling, delayed capillary refill","Low urine output"],"interventions":["Draw lactate and blood cultures before antibiotics if no delay","Broad-spectrum antibiotics within one hour","30 mL/kg crystalloid for hypotension or lactate of 4 or more","Norepinephrine for MAP under 65 after fluids","Repeat lactate if the first is elevated","Track urine output, about 0.5 mL/kg/h or more"],"pitfalls":["Older adults may not mount a fever","Do not delay antibiotics for imaging or the urinalysis"],"flags":["Surviving Sepsis Campaign 2021 advises against qSOFA alone as a screening tool."]},{"id":"vasopressor-safety","title":"Peripheral vasopressor safety","kind":"topic","category":"Medical emergencies","summary":"Short-term peripheral norepinephrine is acceptable when it avoids delay, with close site monitoring.","assess":["IV site color, temperature, swelling","Blood pressure and MAP trend","Heart rhythm"],"interventions":["Use a large, proximal vein, ideally antecubital or above","Confirm blood return before starting","Check the site often per policy","Know the extravasation protocol and where the antidote is kept","Use a dedicated line, no bolus meds through it"],"pitfalls":["Do not titrate beyond the MAP goal"],"flags":[]},{"id":"anaphylaxis","title":"Anaphylaxis","kind":"topic","category":"Medical emergencies","summary":"Rapid-onset, potentially fatal allergic reaction involving the skin, airway, breathing or circulation.","assess":["Hives, flushing, lip or tongue swelling","Hoarse voice, stridor, throat tightness","Wheeze, low SpO2","Hypotension, syncope","Vomiting, abdominal cramping"],"interventions":["IM epinephrine in the anterolateral thigh first","Lay flat with legs up, or sitting if breathing is worse lying down","High-flow oxygen and a large-bore IV","Fluid bolus for hypotension","Repeat IM epinephrine in 5 to 15 min if needed","Antihistamines and steroids are adjuncts only"],"pitfalls":["Skin signs are absent in a minority of cases","Never sit or stand a hypotensive patient up suddenly"],"flags":[]},{"id":"acs-stemi","title":"Acute coronary syndrome and STEMI","kind":"topic","category":"Cardiovascular","summary":"Myocardial ischemia from coronary occlusion. STEMI needs emergency reperfusion.","assess":["Chest pressure, radiation to the arm or jaw","Diaphoresis, nausea, dyspnea","Atypical presentations in women, older adults and people with diabetes","ECG within 10 minutes of arrival"],"interventions":["Continuous cardiac monitoring","Aspirin unless contraindicated","Oxygen only if SpO2 is under 90%","Right-sided leads for inferior STEMI before nitrates","Prepare for the cath lab, door-to-balloon 90 minutes or less"],"pitfalls":["Nitrates are dangerous in RV infarction, with SBP under 90, or after recent PDE-5 inhibitor use"],"flags":[]},{"id":"ecg-leads","title":"ECG lead territories","kind":"card","category":"Cardiovascular","summary":"Which leads look at which part of the heart.","assess":["Inferior: II, III, aVF (usually right coronary artery)","Lateral: I, aVL, V5, V6","Anterior: V3, V4","Septal: V1, V2","Right ventricle: V4R"],"interventions":["Obtain right-sided leads for any inferior STEMI","Compare with prior ECGs","Repeat the ECG if symptoms change"],"pitfalls":[],"flags":[]},{"id":"asthma-exacerbation","title":"Asthma exacerbation","kind":"topic","category":"Respiratory","summary":"Acute bronchospasm, airway inflammation and mucus plugging.","assess":["Speech: sentences, phrases or words","Accessory muscle use, retractions","Wheeze, or a quiet chest","SpO2 and respiratory rate trend","Mental status and fatigue"],"interventions":["Inhaled SABA, repeated or continuous","Ipratropium in moderate to severe attacks","Early systemic steroid","Oxygen to keep SpO2 at about 93 to 95%","Escalate early for a silent chest or drowsiness"],"pitfalls":["A quieter wheeze can mean less airflow, not improvement","Avoid sedatives"],"flags":[]},{"id":"dka","title":"Diabetic ketoacidosis","kind":"topic","category":"Medical emergencies","summary":"Insulin deficiency causing hyperglycemia, ketosis and an anion-gap metabolic acidosis.","assess":["Kussmaul breathing, fruity breath","Vomiting, abdominal pain","Dehydration","Glucose, pH, bicarbonate, anion gap, potassium"],"interventions":["Isotonic fluids first","Check potassium before insulin; hold insulin if below 3.3","Continuous insulin infusion","Add dextrose when glucose falls to about 250","Continue insulin until the gap closes","Overlap SC basal insulin 1 to 2 h before stopping the drip"],"pitfalls":["Do not stop insulin because glucose looks normal","Watch younger patients for headache or behavior change (cerebral edema)"],"flags":["2024 international consensus revised DKA definitions and thresholds."]},{"id":"potassium","title":"Potassium disorders","kind":"topic","category":"Medical emergencies","summary":"Both high and low potassium can cause fatal arrhythmias.","assess":["Low: weakness, cramps, flattened T waves, U waves","High: weakness, peaked T waves, wide QRS","Cardiac monitor","Renal function and medications"],"interventions":["Never give IV potassium as a push","Follow facility limits for peripheral infusion rate","Recheck levels per protocol","In hyperkalemia, anticipate calcium for membrane stabilization first"],"pitfalls":["Hemolyzed samples can falsely raise potassium"],"flags":[]},{"id":"head-injury","title":"Traumatic brain injury","kind":"topic","category":"Neurological","summary":"Injury ranging from concussion to expanding hemorrhage.","assess":["Level of consciousness and orientation","Pupil size and reaction","Motor strength and symmetry","Anticoagulant or antiplatelet use","Vomiting, worsening headache, seizure"],"interventions":["Frequent neuro checks, documenting trends","Head of bed at 30° unless contraindicated","Expedite CT for high-risk features","Prepare anticoagulant reversal per protocol","Escalate at once for a pupil change or Cushing triad"],"pitfalls":["A lucid interval can precede rapid decline","Do not lower BP without provider direction when ICP is suspected"],"flags":[]},{"id":"neuro-checks-card","title":"Level of consciousness reference","kind":"card","category":"Neurological","summary":"Descriptive reference for documenting neurological status without a licensed scoring tool.","assess":["Eye opening: spontaneous, to voice, to pressure, none","Verbal: oriented, confused, words only, sounds only, none","Motor: obeys, localizes, withdraws, abnormal posturing, none","Pupils: size in mm, shape, reaction, equality"],"interventions":["Document the exact stimulus used","Compare with the previous check, not only the baseline","Report any decline right away"],"pitfalls":[],"flags":[]},{"id":"ottawa-ankle","title":"Ottawa ankle and foot rules","kind":"card","category":"Musculoskeletal and wound","summary":"Decision rule for imaging after ankle or midfoot injury.","assess":["Bone tenderness at the posterior edge or tip of the lateral malleolus","Bone tenderness at the posterior edge or tip of the medial malleolus","Bone tenderness at the base of the fifth metatarsal or the navicular","Unable to bear weight four steps at injury and in the ED"],"interventions":["Ankle X-ray if malleolar-zone pain plus either malleolar criterion or the weight-bearing criterion","Foot X-ray if midfoot pain plus either foot criterion or the weight-bearing criterion"],"pitfalls":["Does not apply to intoxicated patients, multiple injuries or reduced sensation"],"flags":[]},{"id":"neurovascular-check","title":"Neurovascular assessment","kind":"topic","category":"Musculoskeletal and wound","summary":"Checking circulation, sensation and movement distal to an injury.","assess":["Pain out of proportion, pain on passive stretch","Pallor, cool skin, capillary refill","Pulses distal to the injury","Numbness or tingling","Ability to move fingers or toes"],"interventions":["Document a baseline before splinting","Recheck after any splint, cast or wrap","Loosen dressings and escalate for worsening findings","Elevate to heart level if compartment syndrome is suspected, not above"],"pitfalls":["Pulses can remain present in compartment syndrome"],"flags":[]},{"id":"pediatric-fever","title":"Fever in children","kind":"topic","category":"Pediatrics","summary":"Most fevers in well-appearing, immunized children are viral. Appearance matters more than the number.","assess":["Activity, color, interaction","Hydration: wet diapers, tears, mucous membranes","Work of breathing","Rash, especially one that does not blanch","Age under 3 months needs provider evaluation"],"interventions":["Weight-based antipyretics from the reference table","Measure with an oral syringe","Encourage fluids","Clear return precautions"],"pitfalls":["Avoid aspirin in children","Watch for duplicate acetaminophen in combination products"],"flags":[]},{"id":"weight-based-safety","title":"Weight-based dosing safety","kind":"topic","category":"Pediatrics","summary":"Most pediatric medication errors involve weight, units or concentration.","assess":["Weight in kilograms, measured not estimated where possible","Allergies","Product concentration"],"interventions":["Record weight in kg only","Calculate from the vetted reference table","Check that the dose does not exceed the adult maximum","Independent double-check for high-alert drugs","Convert to volume using the actual product concentration"],"pitfalls":["Pounds entered as kilograms more than doubles the dose"],"flags":[]},{"id":"sepsis-screening-card","title":"Sepsis screening tools","kind":"card","category":"Medical emergencies","summary":"Descriptive comparison of common screens. Use the one your facility has adopted.","assess":["SIRS: temperature, heart rate, respiratory rate and white count criteria","qSOFA: altered mentation, respiratory rate, systolic BP","NEWS-type early-warning scores: weighted vital-sign scores"],"interventions":["Screen at triage and with any change in condition","A positive screen starts the facility sepsis pathway"],"pitfalls":[],"flags":["SSC 2021 recommends against qSOFA alone as a single screening tool."]},{"id":"esi-card","title":"Emergency Severity Index (descriptive)","kind":"card","category":"Triage","summary":"Five-level triage algorithm. Described here without the licensed handbook content.","assess":["Level 1: needs an immediate life-saving intervention","Level 2: high-risk situation, new confusion or lethargy, or severe pain or distress","Levels 3 to 5: sorted by the number of different resources expected"],"interventions":["Reassess while patients wait","Up-triage for danger-zone vital signs per your facility's version"],"pitfalls":[],"flags":["ESI v4 and v5 handbooks differ in some definitions. Confirm which version your ED uses before teaching or testing triage levels."]},{"id":"gi-bleed","title":"Gastrointestinal bleeding","kind":"topic","category":"Gastrointestinal","summary":"Upper bleeds (above the ligament of Treitz) often show as hematemesis or melena. Lower bleeds as bright red blood per rectum.","assess":["Hematemesis, coffee-ground emesis, melena","Orthostatic dizziness, syncope","Tachycardia before hypotension","NSAID, anticoagulant, alcohol and liver disease history"],"interventions":["Two large-bore IVs","Type and crossmatch, CBC, coagulation labs","NPO for possible endoscopy","Transfuse for instability or per threshold","Protect the airway in active hematemesis","IV proton pump inhibitor per order"],"pitfalls":["Hemoglobin lags behind acute loss","Beta-blockers can blunt tachycardia"],"flags":[]},{"id":"massive-transfusion","title":"Transfusion and massive transfusion","kind":"topic","category":"Medical emergencies","summary":"Blood product replacement for hemorrhage, given in balanced ratios when massive transfusion is activated.","assess":["Two-person bedside identity and product check","Baseline vital signs before the unit","Vital signs at 15 minutes and per policy","Fever, chills, back pain, dyspnea, hives"],"interventions":["Use a blood warmer for rapid or large volumes","Watch calcium; citrate in blood binds it","For a suspected reaction: stop, keep the line open with saline through new tubing, notify the provider and blood bank","Send the bag and post-transfusion labs"],"pitfalls":["Most hemolytic reactions come from identification errors","Large crystalloid volumes dilute clotting factors"],"flags":[]},{"id":"ectopic-pregnancy","title":"Ectopic pregnancy","kind":"topic","category":"Obstetric and gynecologic","summary":"A pregnancy implanted outside the uterus, usually in a fallopian tube. Rupture causes life-threatening bleeding.","assess":["Pregnancy test for any person of reproductive age with abdominal pain or bleeding","Unilateral pelvic pain, spotting","Shoulder-tip pain (blood under the diaphragm)","Signs of shock"],"interventions":["Two large-bore IVs and type and crossmatch with Rh status","NPO","Prepare for surgery if unstable","Rh immune globulin if Rh negative","Methotrexate only for stable, unruptured cases"],"pitfalls":["A negative urine test early on can miss low hCG; follow the provider's plan"],"flags":[]},{"id":"stroke","title":"Acute ischemic stroke","kind":"topic","category":"Neurological","summary":"Sudden focal deficit from a blocked artery. Treatment depends on time from last known well.","assess":["Last known well, to the minute","Point-of-care glucose","Face, arm and speech changes, vision loss, imbalance","Anticoagulant use and recent surgery or bleeding"],"interventions":["Activate the stroke team","Rapid non-contrast CT","BP below 185/110 before thrombolysis and below 180/105 after","Frequent neuro checks per protocol","NPO until a swallow screen is passed","Hold antiplatelets for 24 h after thrombolysis"],"pitfalls":["Headache, vomiting or worsening deficit after thrombolysis may be hemorrhage","Lowering BP too far can extend the stroke"],"flags":["Tenecteplase was approved for acute ischemic stroke in 2025; many protocols changed from alteplase."]},{"id":"stroke-assessment-card","title":"Stroke assessment reference","kind":"card","category":"Neurological","summary":"Descriptive reference for a focused stroke exam. Use your facility's validated scale for scoring.","assess":["Level of consciousness and orientation","Gaze and visual fields","Facial symmetry","Arm and leg drift","Sensation","Speech: slurring, word-finding, comprehension","Neglect of one side"],"interventions":["Document findings in the same order each time","Compare with the prior exam, not only the baseline","Report any decline right away"],"pitfalls":[],"flags":[]},{"id":"opioid-toxicity","title":"Opioid toxicity","kind":"topic","category":"Toxicology","summary":"Respiratory depression is the life threat. Pinpoint pupils and decreased consciousness are classic signs.","assess":["Respiratory rate and depth, SpO2","Pupil size","Level of consciousness","Evidence of long-acting or patch formulations"],"interventions":["Ventilate with a bag-valve mask before and during naloxone","Titrate naloxone to adequate breathing","Anticipate re-sedation and repeat doses","Consider a naloxone infusion for long-acting opioids","Offer naloxone and harm-reduction resources at discharge"],"pitfalls":["Abrupt full reversal can cause withdrawal, agitation and vomiting","Naloxone does not reverse xylazine or benzodiazepines"],"flags":["Xylazine adulteration is increasingly common; sedation may persist after breathing improves."]},{"id":"hypoglycemia","title":"Hypoglycemia","kind":"topic","category":"Medical emergencies","summary":"Low blood glucose causing adrenergic and neuroglycopenic symptoms. Can mimic stroke or intoxication.","assess":["Sweating, tremor, tachycardia","Confusion, behavior change, seizure","Point-of-care glucose","Insulin or sulfonylurea use"],"interventions":["Oral fast-acting sugar if awake and able to swallow","IV dextrose (D10 in children) if not","Glucagon IM or intranasal if no IV access","Recheck in 15 minutes","Food with complex carbohydrate once able to eat"],"pitfalls":["Sulfonylurea lows can recur for many hours","Beta-blockers can mask warning signs"],"flags":[]},{"id":"svt","title":"Supraventricular tachycardia","kind":"topic","category":"Cardiovascular","summary":"Regular narrow-complex tachycardia, usually from a re-entry circuit.","assess":["Rate often 150 to 250, regular, no visible P waves","Stability: BP, mental status, chest pain, heart failure signs","12-lead ECG"],"interventions":["Vagal maneuvers first in stable patients","Adenosine rapid push with flush through a proximal IV","Run a rhythm strip during treatment","Synchronized cardioversion if unstable"],"pitfalls":["Warn the patient about brief chest pressure with adenosine","Irregular rhythms are not SVT; adenosine will not convert atrial fibrillation"],"flags":[]},{"id":"chemical-eye","title":"Chemical eye injury","kind":"topic","category":"Ocular and ENT","summary":"A true ocular emergency. Irrigation starts before any other assessment.","assess":["Substance and time of exposure","pH of the conjunctival sac before and after irrigation","Visual acuity after irrigation","Corneal clouding or limbal whitening"],"interventions":["Irrigate immediately with saline or lactated Ringer's","Topical anesthetic to allow irrigation","Check pH after a 5 to 10 minute pause; continue until about 7.0 to 7.5","Sweep the fornices for particles","Ophthalmology evaluation"],"pitfalls":["Never neutralize with acids or bases","Alkali burns are often worse than acid burns"],"flags":[]},{"id":"laceration-care","title":"Laceration care","kind":"topic","category":"Musculoskeletal and wound","summary":"Wound assessment, cleaning and preparation for closure.","assess":["Mechanism, time of injury and contamination","Distal sensation, motor function and tendon function before anesthesia","Foreign body risk","Tetanus history"],"interventions":["Pressure for bleeding control","High-pressure irrigation with saline or tap water","Tetanus booster if 10 or more years (clean, minor) or 5 or more years (dirty or major)","Tetanus immune globulin if fewer than 3 prior doses or unknown, for dirty wounds","Wound care and infection teaching"],"pitfalls":["Bite wounds and hand wounds carry higher infection risk"],"flags":[]}],"dosing":[{"id":"epi-arrest","drug":"Epinephrine","indication":"Pulseless arrest","route":"IV/IO","per_kg":0.01,"unit":"mg","max_dose":1,"conc":0.1,"conc_label":"0.1 mg/mL","repeat":"Every 3 to 5 min during arrest","min_kg":0,"age_note":"All ages; adult dose is the cap.","source":"AHA PALS 2020 (transcribed)","notes":"Check the concentration on the syringe; two strengths are stocked.","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"epi-anaphylaxis","drug":"Epinephrine","indication":"Anaphylaxis","route":"IM, anterolateral thigh","per_kg":0.01,"unit":"mg","max_dose":0.5,"conc":1,"conc_label":"1 mg/mL","repeat":"Every 5 to 15 min if no response","min_kg":0,"age_note":"Many pediatric protocols cap a child at 0.3 mg. Age-banding review needed.","source":"WAO 2020 / AHA (transcribed)","notes":"IM, not IV push, outside of arrest.","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"amiodarone-arrest","drug":"Amiodarone","indication":"Pulseless VF / pVT","route":"IV/IO bolus","per_kg":5,"unit":"mg","max_dose":300,"conc":50,"conc_label":"50 mg/mL","repeat":"May repeat up to 3 total doses (pediatric)","min_kg":0,"age_note":"Adult first dose is 300 mg.","source":"AHA PALS 2020 (transcribed)","notes":"","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"adenosine","drug":"Adenosine","indication":"SVT, first dose","route":"Rapid IV push with flush","per_kg":0.1,"unit":"mg","max_dose":6,"conc":3,"conc_label":"3 mg/mL","repeat":"Second dose 0.2 mg/kg, max 12 mg","min_kg":0,"age_note":"","source":"AHA PALS 2020 (transcribed)","notes":"Use the port closest to the heart. Expect brief asystole.","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"atropine-brady","drug":"Atropine","indication":"Bradycardia (vagal or AV block)","route":"IV/IO","per_kg":0.02,"unit":"mg","max_dose":0.5,"conc":0.1,"conc_label":"0.1 mg/mL","repeat":"May repeat once","min_kg":0,"age_note":"Older PALS editions listed a 0.1 mg minimum dose. Flag: version conflict.","source":"AHA PALS 2020 (transcribed)","notes":"","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"naloxone","drug":"Naloxone","indication":"Opioid toxicity, full reversal","route":"IV/IO/IM","per_kg":0.1,"unit":"mg","max_dose":2,"conc":0.4,"conc_label":"0.4 mg/mL","repeat":"Every 2 to 3 min as needed","min_kg":0,"age_note":"Lower titrated doses are used when the goal is breathing, not full reversal.","source":"AHA PALS 2020 (transcribed)","notes":"Watch for re-sedation; naloxone wears off before many opioids.","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"lorazepam","drug":"Lorazepam","indication":"Status epilepticus","route":"IV","per_kg":0.1,"unit":"mg","max_dose":4,"conc":2,"conc_label":"2 mg/mL","repeat":"May repeat once after 5 to 10 min","min_kg":0,"age_note":"","source":"AES 2016 guideline (transcribed)","notes":"Have bag-valve-mask ready. Respiratory depression risk.","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"dextrose-d10","drug":"Dextrose 10%","indication":"Hypoglycemia","route":"IV/IO","per_kg":0.5,"unit":"g","max_dose":25,"conc":0.1,"conc_label":"0.1 g/mL (D10)","repeat":"Recheck glucose in 15 min","min_kg":0,"age_note":"D10 preferred in children; concentrations above D25 are avoided peripherally in kids.","source":"AHA PALS 2020 (transcribed)","notes":"0.5 g/kg of D10 is 5 mL/kg.","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"ondansetron","drug":"Ondansetron","indication":"Nausea and vomiting","route":"IV/PO","per_kg":0.15,"unit":"mg","max_dose":4,"conc":2,"conc_label":"2 mg/mL (IV)","repeat":"Every 8 h as needed","min_kg":8,"age_note":"Typically 6 months and older. Age-banding review needed.","source":"Common ED reference (transcribed)","notes":"QT prolongation risk.","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"acetaminophen","drug":"Acetaminophen","indication":"Fever or pain","route":"PO","per_kg":15,"unit":"mg","max_dose":1000,"conc":32,"conc_label":"160 mg/5 mL","repeat":"Every 4 to 6 h, max 5 doses in 24 h","min_kg":0,"age_note":"Under 12 weeks: provider evaluation for fever before dosing.","source":"Common pediatric reference (transcribed)","notes":"Check combination cold products for hidden acetaminophen.","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"ibuprofen","drug":"Ibuprofen","indication":"Fever or pain","route":"PO","per_kg":10,"unit":"mg","max_dose":400,"conc":20,"conc_label":"100 mg/5 mL","repeat":"Every 6 to 8 h","min_kg":5,"age_note":"6 months and older only. Avoid in dehydration.","source":"Common pediatric reference (transcribed)","notes":"Give with food.","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"ns-bolus","drug":"Isotonic crystalloid","indication":"Shock, fluid bolus","route":"IV/IO","per_kg":20,"unit":"mL","max_dose":1000,"conc":null,"conc_label":"","repeat":"Reassess after each bolus","min_kg":0,"age_note":"PALS 2020 lists 10 to 20 mL/kg. Use 10 mL/kg in suspected cardiogenic shock or DKA. Flag: version conflict.","source":"AHA PALS 2020 (transcribed)","notes":"Reassess lungs and liver edge after each bolus.","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"midazolam-in","drug":"Midazolam","indication":"Status epilepticus, no IV access","route":"Intranasal (atomizer)","per_kg":0.2,"unit":"mg","max_dose":10,"conc":5,"conc_label":"5 mg/mL","repeat":"May repeat once per protocol","min_kg":0,"age_note":"Split the volume between nostrils.","source":"AES 2016 guideline (transcribed)","notes":"Respiratory depression risk. Have bag-valve mask ready.","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"diphenhydramine","drug":"Diphenhydramine","indication":"Allergic reaction (adjunct)","route":"IV/IM/PO","per_kg":1,"unit":"mg","max_dose":50,"conc":50,"conc_label":"50 mg/mL","repeat":"Every 6 h as needed","min_kg":0,"age_note":"Not for children under 2 without provider direction. Age-banding review needed.","source":"Common ED reference (transcribed)","notes":"Adjunct only. Never a substitute for epinephrine in anaphylaxis.","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"dexamethasone-croup","drug":"Dexamethasone","indication":"Croup","route":"PO/IM/IV","per_kg":0.6,"unit":"mg","max_dose":16,"conc":4,"conc_label":"4 mg/mL","repeat":"Single dose","min_kg":0,"age_note":"Some protocols use 0.15 mg/kg. Flag: protocol variation.","source":"Common pediatric reference (transcribed)","notes":"","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"calcium-chloride","drug":"Calcium chloride 10%","indication":"Hyperkalemia, hypocalcemia, CCB toxicity","route":"IV/IO (central or large vein)","per_kg":20,"unit":"mg","max_dose":2000,"conc":100,"conc_label":"100 mg/mL (10%)","repeat":"Per provider","min_kg":0,"age_note":"Calcium gluconate is often preferred peripherally in children.","source":"AHA PALS 2020 (transcribed)","notes":"Severe tissue injury if it extravasates. Do not mix with bicarbonate.","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"sodium-bicarbonate","drug":"Sodium bicarbonate 8.4%","indication":"Hyperkalemia or TCA toxicity","route":"IV/IO slow push","per_kg":1,"unit":"mEq","max_dose":50,"conc":1,"conc_label":"1 mEq/mL (8.4%)","repeat":"Per provider","min_kg":0,"age_note":"Dilute to 4.2% (0.5 mEq/mL) in infants.","source":"AHA PALS 2020 (transcribed)","notes":"Flush between bicarbonate and calcium or catecholamines.","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"},{"id":"ketorolac","drug":"Ketorolac","indication":"Moderate pain","route":"IV/IM","per_kg":0.5,"unit":"mg","max_dose":15,"conc":15,"conc_label":"15 mg/mL","repeat":"Every 6 h, max 5 days","min_kg":0,"age_note":"Some references allow up to 30 mg. Flag: version conflict. Avoid in renal impairment, bleeding risk, late pregnancy.","source":"Common ED reference (transcribed)","notes":"Doses above 15 mg add little analgesia and more risk.","verified":false,"signoff":null,"provenance":"Transcribed by Claude, not yet checked against a formulary"}],"excluded":[{"drug":"Heparin","reason":"Weight-based nomograms vary by site. Use your facility's protocol; this app will not calculate it."}]};
