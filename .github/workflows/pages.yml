name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          # Publish only the site itself (no .github, tests, or docs).
          cp -r index.html calculator.html quiz.html sw.js manifest.webmanifest css js icons _site/
          # Stamp the service-worker cache with the commit so every deploy
          # replaces visitors' offline copy (no manual CACHE_VERSION bump).
          sed -i "s/^const CACHE_VERSION = '[^']*';/const CACHE_VERSION = '${GITHUB_SHA::12}';/" _site/sw.js
          grep -q "CACHE_VERSION = '${GITHUB_SHA::12}'" _site/sw.js

      - name: Check offline precache list
        run: node .github/scripts/check-precache.js _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
